<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Notifications - Admin - Eva Transport</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Define the new primary color */
        :root {
            --primary-color: #dc3545; /* Red */
            --primary-color-dark: #c82333; /* Darker red for hover */
            --alert-success-color: #155724; /* Keep alert-success text color */
            --alert-success-bg: #d4edda; /* Keep alert-success background */
            --alert-success-border: #c3e6cb; /* Keep alert-success border */
            --alert-danger-color: #721c24; /* Keep alert-danger text color */
            --alert-danger-bg: #f8d7da; /* Keep alert-danger background */
            --alert-danger-border: #f5c6cb; /* Keep alert-danger border */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
            direction: ltr;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        header {
            background-color: var(--primary-color); /* Changed to red */
            color: white;
            padding: 15px 20px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 8px 8px 0 0;
        }
        header h1 { margin: 0; font-size: 2em; }
        nav {
            background-color: #e9ecef;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        nav ul { list-style-type: none; padding: 0; margin: 0; text-align: center; }
        nav ul li { display: inline-block; margin: 0 15px; }
        nav ul li a { 
            text-decoration: none; 
            color: var(--primary-color); /* Changed to red */
            font-weight: bold; 
            padding: 5px 0; 
            transition: color 0.3s ease; 
        }
        nav ul li a:hover { color: var(--primary-color-dark); } /* Darker red on hover */
        h2 { 
            color: var(--primary-color); /* Changed to red */
            border-bottom: 2px solid #e9ecef; 
            padding-bottom: 10px; 
            margin-top: 0; 
        }
        .btn {
            display: inline-block;
            background-color: var(--primary-color); /* Changed to red */
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
            margin-right: 5px;
        }
        .btn:hover { background-color: var(--primary-color-dark); } /* Darker red on hover */
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input[type="text"],
        .form-group textarea,
        .form-group select {
            width: calc(100% - 22px);
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }
        .form-group input[type="radio"] {
            margin-right: 5px;
        }
        .form-group .radio-group label {
            display: inline-block;
            margin-right: 20px;
            font-weight: normal;
        }
        .alert {
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid transparent;
            border-radius: 4px;
        }
        /* Keeping alert colors as they are, as they are not part of the main theme color */
        .alert-success {
            color: var(--alert-success-color);
            background-color: var(--alert-success-bg);
            border-color: var(--alert-success-border);
        }
        .alert-danger {
            color: var(--alert-danger-color);
            background-color: var(--alert-danger-bg);
            border-color: var(--alert-danger-border);
        }
    </style>
</head>
<body>
    <header>
        <h1>Admin Dashboard</h1>
    </header>

    <div class="container">
        <nav>
            <ul>
                <li><a href="admin_dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="admin_manage_users.html"><i class="fas fa-users"></i> Manage Users</a></li>
                <li><a href="admin_manage_routes.html"><i class="fas fa-route"></i> Manage Routes</a></li>
                <li><a href="admin_send_notifications.html"><i class="fas fa-bell"></i> Send Notifications</a></li>
                <li><a href="admin_view_reports.html"><i class="fas fa-chart-bar"></i> View Reports</a></li>
                <!-- Removed Logout Button -->
            </ul>
        </nav>

        <h2>Send Notifications</h2>

        <div id="notification-alert" class="alert" style="display:none;"></div>

        <form id="notificationForm">
            <div class="form-group">
                <label for="notificationTitle">Notification Title</label>
                <input type="text" id="notificationTitle" name="notificationTitle" placeholder="e.g., Important Update, Bus Delay" required>
            </div>

            <div class="form-group">
                <label for="notificationMessage">Message</label>
                <textarea id="notificationMessage" name="notificationMessage" placeholder="Type your message here..." required></textarea>
            </div>

            <div class="form-group">
                <label>Send To:</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="recipientType" value="all" checked> All Users
                    </label>
                    <label>
                        <input type="radio" name="recipientType" value="workers"> Workers Only
                    </label>
                    <label>
                        <input type="radio" name="recipientType" value="drivers"> Drivers Only
                    </label>
                </div>
            </div>

            <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Send Notification</button>
        </form>
    </div>

    <script>
        const notificationForm = document.getElementById('notificationForm');
        const notificationTitleInput = document.getElementById('notificationTitle');
        const notificationMessageInput = document.getElementById('notificationMessage');
        const notificationAlert = document.getElementById('notification-alert');

        notificationForm.addEventListener('submit', function(event) {
            event.preventDefault();

            const title = notificationTitleInput.value.trim();
            const message = notificationMessageInput.value.trim();
            const recipientType = document.querySelector('input[name="recipientType"]:checked').value;

            if (!title || !message) {
                showAlert('Please fill in both the title and message fields.', 'danger');
                return;
            }

            // In a real application, you would send this data to your backend
            // using Fetch API or XMLHttpRequest.
            console.log('Sending Notification:');
            console.log('Title:', title);
            console.log('Message:', message);
            console.log('Recipient Type:', recipientType);

            // Simulate successful sending
            showAlert(`Notification "${title}" sent successfully to ${recipientType === 'all' ? 'all users' : recipientType}.`, 'success');
            notificationForm.reset(); // Clear the form after sending
        });

        function showAlert(message, type) {
            notificationAlert.textContent = message;
            notificationAlert.className = `alert alert-${type}`; // alert-success or alert-danger
            notificationAlert.style.display = 'block';

            // Hide alert after 5 seconds
            setTimeout(() => {
                notificationAlert.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
